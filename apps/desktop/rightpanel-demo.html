<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EveryBuddy · 右侧栏折叠按钮布局预览</title>
<style>
  :root{
    --paper:#faf8f4; --paper-deep:#f4f0e9; --line:#e9e4da; --line-strong:#d6d0c4;
    --ink:#1f1c18; --ink-2:#57534b; --ink-3:#a39e93; --hover:#f1ede4;
    --accent:#0d7a5f; --accent-strong:#0a6450; --accent-tint:#e7f2ee;
    --r-s:6px; --r-m:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#e8e3d8;color:var(--ink);padding:28px 16px}
  h1{font-size:16px;text-align:center;margin-bottom:4px}
  p.sub{font-size:12px;color:var(--ink-3);text-align:center;margin-bottom:6px}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 20px;flex-wrap:wrap}
  .controls button{font-size:12.5px;padding:7px 14px;border:1px solid var(--line-strong);
       border-radius:var(--r-s);background:#fff;color:var(--ink);cursor:pointer}
  .controls button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .controls button:hover{background:var(--hover)}
  .controls .sep{width:18px}

  /* ── 窗口 ── */
  .window{width:1100px;height:620px;margin:0 auto;border-radius:12px;overflow:hidden;
     border:1px solid var(--line-strong);box-shadow:0 24px 70px rgba(60,50,30,.28);
     display:flex;flex-direction:column;background:var(--paper);position:relative}

  /* 顶栏三段，与下方三列对应 */
  .topbar{height:40px;display:flex;flex-shrink:0;position:relative;z-index:3}
  .seg-side{width:260px;background:var(--paper-deep);border-right:1px solid var(--line);
     display:flex;align-items:center;padding:0 10px}
  .seg-side .win-tools{display:flex;gap:2px}
  .seg-main{flex:1;background:var(--paper)}
  .seg-right{width:250px;background:var(--paper-deep);border-left:1px solid var(--line);
     display:flex;align-items:center;padding:0 10px;transition:width .25s ease}

  /* 主体 */
  .body{flex:1;display:flex;min-height:0}
  .sidebar{width:260px;background:var(--paper-deep);border-right:1px solid var(--line);
     padding:12px 10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .sidebar .row{height:30px;border-radius:var(--r-s);padding:0 10px;display:flex;align-items:center;gap:8px;
     font-size:12.5px;color:var(--ink-2)}
  .sidebar .row.hl{background:var(--accent-tint);color:var(--accent-strong);font-weight:600}
  .mainview{flex:1;background:var(--paper);display:flex;flex-direction:column}
  .msg{max-width:60%;border-radius:var(--r-m);padding:9px 12px;font-size:12.5px;margin:10px 16px;line-height:1.55}
  .msg.ai{background:var(--paper-deep);border:1px solid var(--line);align-self:flex-start}
  .msg.me{background:var(--accent-tint);align-self:flex-end}

  /* 右侧栏 */
  .rightpanel{width:250px;background:var(--paper-deep);border-left:1px solid var(--line);
     display:flex;flex-direction:column;transition:width .25s ease;overflow:hidden;flex-shrink:0}
  .tabs{display:flex;gap:4px;padding:10px 12px 6px}
  .tabs button{flex:1;font-size:11.5px;padding:6px 0;border:none;border-radius:var(--r-s);
     background:transparent;cursor:pointer;color:var(--ink-2)}
  .tabs button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--ink);font-weight:600}
  .rp-content{flex:1;overflow:auto;padding:2px 12px 12px}
  .rp-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:8px 12px;
     margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:10.5px;background:var(--accent-tint);color:var(--accent-strong);
     border-radius:999px;padding:2px 8px;font-weight:600}
  .step{font-size:12px;padding:6px 8px;border-radius:var(--r-s);border-left:2px solid transparent;color:var(--ink-2)}
  .step.cur{border-left-color:var(--accent);background:var(--accent-tint);color:var(--ink);font-weight:600}
  .step.done{color:var(--ink-3);text-decoration:line-through}

  /* 平台装饰：窗口按钮 / 红绿灯（透明背景，叠在内容上） */
  .win-chrome{position:absolute;top:0;right:0;height:40px;display:none;align-items:center;z-index:4}
  .window[data-platform="win"] .win-chrome{display:flex}
  .win-chrome button{width:46px;height:40px;border:none;background:transparent;color:var(--ink);font-size:13px;cursor:default}
  .win-chrome button:hover{background:rgba(0,0,0,.06)}
  .win-chrome button.close:hover{background:#e81123;color:#fff}
  .traffic{position:absolute;top:0;left:14px;height:40px;display:none;align-items:center;gap:8px;z-index:4}
  .window[data-platform="mac"] .traffic{display:flex}
  .traffic i{width:12px;height:12px;border-radius:50%}
  .traffic i:nth-child(1){background:#ff5f57}
  .traffic i:nth-child(2){background:#febc2e}
  .traffic i:nth-child(3){background:#28c840}

  /* 折叠按钮统一样式（30×30，与左侧栏一致） */
  .rp-collapse,.collapse-floating button{width:30px;height:30px;border:none;background:transparent;border-radius:var(--r-s);
     color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .rp-collapse:hover,.collapse-floating button:hover{background:var(--hover);color:var(--ink)}
  .rp-collapse svg,.collapse-floating svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .collapse-btn-static{width:30px;height:30px;border:none;background:transparent;border-radius:var(--r-s);
     color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .collapse-btn-static:hover{background:var(--hover);color:var(--ink)}
  .collapse-btn-static svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 折叠态浮层按钮：仅折叠时显示，位于右上角（win 贴原生按钮左侧 / mac 直接贴角） */
  .collapse-floating{position:absolute;top:0;height:40px;display:none;align-items:center;z-index:5}
  .window.collapsed .collapse-floating{display:flex}
  .window[data-platform="win"] .collapse-floating{right:142px}  /* 138(WCO)+4，贴紧系统按钮 */
  .window[data-platform="mac"] .collapse-floating{right:8px}

  /* 折叠态：右侧栏与右顶栏宽度归 0，右上角浮层按钮接管 */
  .window.collapsed .rightpanel,.window.collapsed .seg-right{width:0;border-left:none}
</style>
</head>
<body>
  <h1>EveryBuddy · 右侧栏折叠按钮布局</h1>
  <p class="sub">展开：按钮在右侧栏左上角 · 折叠：仅右上角按钮（win 贴原生按钮左侧 / mac 直接贴角），无长条边栏</p>
  <p class="sub">原生窗口按钮背景透明，贴合面板底色</p>

  <div class="controls">
    <button id="btnWin" class="active" onclick="setPlatform('win')">Windows</button>
    <button id="btnMac" onclick="setPlatform('mac')">macOS</button>
    <span class="sep"></span>
    <button onclick="toggleCollapse()">折叠 / 展开右侧栏</button>
  </div>

  <div class="window" id="win" data-platform="win">
    <div class="topbar">
      <div class="seg-side">
        <div class="win-tools">
          <button class="collapse-btn-static" title="折叠侧栏">
            <svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <button class="collapse-btn-static" title="搜索任务">
            <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>
      <div class="seg-main"></div>
      <div class="seg-right">
        <!-- 展开态：折叠按钮在右侧栏左上角 -->
        <button class="rp-collapse" title="收起" onclick="toggleCollapse()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar">
        <div class="row hl">＋ 新建任务</div>
        <div class="row">规划：电商重构</div>
        <div class="row">办公周报</div>
        <div class="row">+ 工作空间</div>
      </aside>
      <main class="mainview">
        <div class="msg ai">好的，我会按计划逐步执行。</div>
        <div class="msg me">开始吧</div>
        <div class="msg ai">计划已就绪：<br/>1. 分析需求<br/>2. 生成代码<br/>3. 运行测试</div>
      </main>
      <aside class="rightpanel">
        <div class="tabs">
          <button class="on">待办</button><button>文件</button><button>预览</button>
        </div>
        <div class="rp-content">
          <div class="rp-card">计划已就绪 <span class="badge">2/3</span></div>
          <div class="step done">☑ 分析需求</div>
          <div class="step cur">▸ 生成代码</div>
          <div class="step">☐ 运行测试</div>
        </div>
      </aside>
    </div>

    <!-- Windows 原生窗口按钮（透明背景叠放，演示透明效果） -->
    <div class="win-chrome">
      <button title="最小化">─</button>
      <button title="最大化 / 还原（缩放）">▢</button>
      <button class="close" title="关闭">✕</button>
    </div>
    <!-- macOS 红绿灯 -->
    <div class="traffic"><i></i><i></i><i></i></div>
    <!-- 折叠态浮层展开按钮（仅折叠时显示） -->
    <div class="collapse-floating">
      <button title="打开右侧面板" onclick="toggleCollapse()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
      </button>
    </div>
  </div>

  <p class="sub" style="margin-top:14px">▲ 点击右侧栏左上角图标或上方按钮折叠/展开；切换平台查看布局差异</p>

<script>
  const win = document.getElementById("win");
  function setPlatform(p){
    win.dataset.platform = p;
    document.getElementById("btnWin").classList.toggle("active", p === "win");
    document.getElementById("btnMac").classList.toggle("active", p === "mac");
  }
  function toggleCollapse(){
    win.classList.toggle("collapsed");
  }
</script>
</body>
</html>
